<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80">
  <defs>
    <!-- jaring halus (net ground) khas renda -->
    <pattern id="net" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V4 M0 0 H4" fill="none" stroke="#f5efe4" stroke-width="0.55" opacity="0.72" />
    </pattern>
    <!-- medallion bunga 8 kelopak -->
    <g id="rosette">
      <g fill="#f5efe4" opacity="0.92">
        <ellipse rx="2.6" ry="6.2" transform="rotate(0)" />
        <ellipse rx="2.6" ry="6.2" transform="rotate(45)" />
        <ellipse rx="2.6" ry="6.2" transform="rotate(90)" />
        <ellipse rx="2.6" ry="6.2" transform="rotate(135)" />
      </g>
      <circle r="2.4" fill="#f5efe4" />
      <circle r="1" fill="#f5efe4" opacity="0.35" />
      <circle r="9.4" fill="none" stroke="#f5efe4" stroke-width="0.9" opacity="0.85" />
      <circle r="11" fill="none" stroke="#f5efe4" stroke-width="1.6" stroke-dasharray="1.2 2.6"
              stroke-linecap="round" opacity="0.9" />
    </g>
  </defs>

  <!-- badan renda + isi tiap lengkung tepi, semua beralas jaring -->
  <rect x="13" y="0" width="51" height="80" fill="url(#net)" />
  <g fill="url(#net)">
    <circle cx="13" cy="10" r="9.6" /><circle cx="13" cy="30" r="9.6" />
    <circle cx="13" cy="50" r="9.6" /><circle cx="13" cy="70" r="9.6" />
  </g>

  <!-- lengkung tepi (scallop): hanya separuh kiri yang menonjol keluar badan renda -->
  <g fill="none" stroke="#f5efe4" stroke-linecap="round">
    <g stroke-width="1.7">
      <path d="M13 0.4 A9.6 9.6 0 0 0 13 19.6" />
      <path d="M13 20.4 A9.6 9.6 0 0 0 13 39.6" />
      <path d="M13 40.4 A9.6 9.6 0 0 0 13 59.6" />
      <path d="M13 60.4 A9.6 9.6 0 0 0 13 79.6" />
    </g>
    <g stroke-width="0.9" opacity="0.8">
      <path d="M13 4.1 A5.9 5.9 0 0 0 13 15.9" />
      <path d="M13 24.1 A5.9 5.9 0 0 0 13 35.9" />
      <path d="M13 44.1 A5.9 5.9 0 0 0 13 55.9" />
      <path d="M13 64.1 A5.9 5.9 0 0 0 13 75.9" />
    </g>
  </g>

  <!-- picot: titik kecil di ujung tiap lengkung -->
  <g fill="#f5efe4">
    <circle cx="2.6" cy="10" r="1.25" /><circle cx="2.6" cy="30" r="1.25" />
    <circle cx="2.6" cy="50" r="1.25" /><circle cx="2.6" cy="70" r="1.25" />
    <circle cx="13" cy="0" r="1.7" /><circle cx="13" cy="20" r="1.7" />
    <circle cx="13" cy="40" r="1.7" /><circle cx="13" cy="60" r="1.7" />
    <circle cx="13" cy="80" r="1.7" />
  </g>

  <!-- tali pengikat vertikal -->
  <path d="M13 0 V80" stroke="#f5efe4" stroke-width="1.3" opacity="0.9" />
  <path d="M24 0 V80" stroke="#f5efe4" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.75" />
  <path d="M57 0 V80" stroke="#f5efe4" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.75" />

  <!-- medallion bunga -->
  <use href="#rosette" x="40" y="20" />
  <use href="#rosette" x="40" y="60" />

  <!-- mata renda kecil di sela medallion -->
  <g fill="none" stroke="#f5efe4" stroke-width="0.9" opacity="0.85">
    <circle cx="31" cy="40" r="2.2" /><circle cx="49" cy="40" r="2.2" />
    <circle cx="31" cy="0" r="2.2" /><circle cx="49" cy="0" r="2.2" />
    <circle cx="31" cy="80" r="2.2" /><circle cx="49" cy="80" r="2.2" />
  </g>

  <!-- tepi jahitan kanan -->
  <rect x="61" y="0" width="3" height="80" fill="#f5efe4" opacity="0.9" />
</svg>
